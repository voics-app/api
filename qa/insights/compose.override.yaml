# Job-local overlay for gitops/local/compose.yaml. All dependencies stay on the
# private compose network; the QA container speaks to service names directly.
services:
  postgres:
    ports: !reset []
  scylla:
    ports: !reset []
  redpanda:
    ports: !reset []
  valkey:
    ports: !reset []
  etcd:
    ports: !reset []
  minio:
    ports: !reset []
  api:
    image: ${QA_IMAGE_PREFIX}/api:fixture
    ports: !reset []
    environment:
      GATEWAY_INTERNAL_URL: http://gateway:4000
      PUBLIC_API_URL: http://api:8080/api/v1
      PUBLIC_GATEWAY_URL: ws://gateway:4000/gateway
      CDN_PUBLIC_URL: http://minio:9000
  messages:
    image: ${QA_IMAGE_PREFIX}/messages:fixture
    ports: !reset []
  gateway:
    image: ${QA_IMAGE_PREFIX}/gateway:fixture
    ports: !reset []
  voice-sfu:
    image: ${QA_IMAGE_PREFIX}/voice-sfu:fixture
    ports: !reset []
  voice-signaling:
    image: ${QA_IMAGE_PREFIX}/voice-signaling:fixture
    environment:
      VOICE_PUBLIC_WS_URL: ws://gateway:4000
  insights-qa:
    image: node:24-alpine
    profiles: [qa]
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    entrypoint: ["node", "/qa/insights.mjs"]
    volumes:
      - ${QA_SCRIPT}:/qa/insights.mjs:ro

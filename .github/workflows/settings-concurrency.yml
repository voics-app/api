name: settings concurrency
on:
  pull_request:
    paths:
      - 'crates/application/src/use_cases/users/update_settings.rs'
      - 'crates/infrastructure/src/postgres/unit_of_work/identity.rs'
      - 'crates/infrastructure/src/postgres/users.rs'
      - 'crates/infrastructure/tests/http_settings_concurrency.rs'
      - 'migrations/0122_user_settings_revision.sql'
      - '.github/workflows/settings-concurrency.yml'
permissions:
  contents: read
jobs:
  settings-concurrency:
    # Only trusted same-repository code runs on the persistent VM.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: vm-runner
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99"
      - name: Race settings PATCHes against disposable Postgres
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/settings-concurrency-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cargo test --locked -p infrastructure --test http_settings_concurrency

name: privacy integration
on:
  pull_request:
    paths:
      - 'crates/infrastructure/tests/http_dm_privacy.rs'
      - 'crates/infrastructure/tests/http_friend_sources.rs'
      - '.github/workflows/privacy-integration.yml'
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run privacy HTTP tests
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/privacy-target"
          if [[ -f crates/infrastructure/tests/http_dm_privacy.rs ]]; then
            cargo test -p infrastructure --test http_dm_privacy
          fi
          if [[ -f crates/infrastructure/tests/http_friend_sources.rs ]]; then
            cargo test -p infrastructure --test http_friend_sources
          fi

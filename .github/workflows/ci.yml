name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  rust:
    uses: discordy-voics/.github/.github/workflows/rust.yml@main
    with:
      description: Discordy REST API (Rust)
      # RUSTSEC-2023-0071 (rsa Marvin attack) has no fixed release; the API never performs RSA decryption.
      audit-args: --ignore RUSTSEC-2023-0071

  docker:
    needs: rust
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@main
    with:
      image-name: api
      description: Discordy REST API

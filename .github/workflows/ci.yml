name: ci

on:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1" # weekly full run: cargo audit picks up new advisories
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: discordy-voics/.github/.github/workflows/rust.yml@feature/59-ci-cache
    with:
      runs-on: vm-runner
      description: Discordy REST API (Rust)
      # RUSTSEC-2023-0071 (rsa Marvin attack) has no fixed release; the API never performs RSA decryption.
      audit-args: --ignore RUSTSEC-2023-0071

  docker:
    needs: rust
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@feature/59-ci-cache
    with:
      runs-on: vm-runner
      push: false
      image-name: api
      description: Discordy REST API

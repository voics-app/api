name: ci

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1" # weekly full run: cargo audit picks up new advisories
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  voice-status-integration:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/api-53-insights'
    runs-on: vm-runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p infrastructure --test http_voice_status --test presence -- --test-threads=1

  gitflow:
    if: github.event_name == 'pull_request'
    uses: discordy-voics/.github/.github/workflows/gitflow-guard.yml@main

  brand:
    # Rebrand check (docs#69): no hard-coded product name or domain in user-visible strings.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-brand.sh
      - run: python3 scripts/check-snowflake.py

  rust:
    permissions:
      contents: read
      actions: read   # shared workflow: tag builds look up the main run of this commit
    uses: discordy-voics/.github/.github/workflows/rust.yml@main
    with:
      description: Voics REST API (Rust)
      # RUSTSEC-2023-0071 (rsa Marvin attack) has no fixed release; the API never performs RSA decryption.
      # RUSTSEC-2026-0459 (libsqlite3-sys bundled SQLite CVE) is only in Cargo.lock as sqlx's optional sqlite backend: the
      # sqlite feature is off, so it is never compiled (`cargo tree -i libsqlite3-sys` is empty), and 0.30 is not built with
      # `bundled`. sqlx 0.8 pins libsqlite3-sys 0.30, so the patched 0.39 cannot be used until sqlx moves; drop this then.
      audit-args: --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459

  docker:
    needs: rust
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@main
    with:
      image-name: api
      description: Voics REST API

name: Scheduled events draft QA
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  event-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Event API and database integration tests
        run: cargo test -p infrastructure --test http_scheduled_events --test postgres_scheduled_events

name: screening integration
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'migrations/**'
      - '.github/workflows/screening-integration.yml'
concurrency:
  group: screening-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  screening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p infrastructure --test http_screening
